name: Build & Deploy ShramSetu (Web & Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare environment file
        working-directory: app
        run: cp .env.example .env

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      # ──────────────────────────────────────────
      # 1. Build Flutter Web & Deploy to GitHub Pages
      # ──────────────────────────────────────────
      - name: Build Flutter Web (release)
        working-directory: app
        run: |
          flutter build web \
            --release \
            --base-href /ShramSetu/ \
            --no-wasm-dry-run

      - name: Deploy Web to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/build/web
          publish_branch: gh-pages
          commit_message: 'deploy: ShramSetu web ${{ github.sha }}'
          force_orphan: true
          enable_jekyll: false

      # ──────────────────────────────────────────
      # 2. Build Android Phone APK & Upload Artifact
      # ──────────────────────────────────────────
      - name: Build Android APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ShramSetu-app-debug.apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
